<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card p-5 text-center shadow-sm" style="max-width: 500px;">

    <div *ngIf="isVerifying">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <h3 class="mt-4">Verifying your email...</h3>
      <p class="text-muted">Please wait while we confirm your account.</p>
    </div>

    <div *ngIf="!isVerifying && success">
      <i class="fa-solid fa-check-circle text-success" style="font-size: 4rem;"></i>
      <h3 class="mt-4">Success!</h3>
      <p class="text-muted">{{ message }}</p>
      <p class="text-sm">You will be redirected to the login page shortly.</p>
      <button class="btn btn-primary mt-3" (click)="goToLogin()">Go to Login</button>
    </div>

    <div *ngIf="!isVerifying && !success">
      <i class="fa-solid fa-times-circle text-danger" style="font-size: 4rem;"></i>
      <h3 class="mt-4">Verification Failed</h3>
      <p class="text-muted">{{ message }}</p>
      <button class="btn btn-primary mt-3" (click)="goToLogin()">Return to Login</button>
    </div>

  </div>
</div>
